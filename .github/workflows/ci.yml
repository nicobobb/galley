name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; only the release job can write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # Galley only ships for Windows, and GPUI's platform code differs per OS.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # Installs the toolchain and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Check the tag matches Cargo.toml
        shell: pwsh
        run: |
          $toml = Get-Content Cargo.toml -Raw
          if ($toml -notmatch '(?m)^version\s*=\s*"([^"]+)"') { throw 'No version in Cargo.toml.' }
          if ("v$($Matches[1])" -ne '${{ github.ref_name }}') {
            throw "Tag ${{ github.ref_name }} doesn't match Cargo.toml version $($Matches[1])."
          }
      - run: .\scripts\package.ps1
        shell: pwsh
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        # Installed copies update from galley-windows-x64.exe, checked against SHA256SUMS.
        run: gh release create '${{ github.ref_name }}' (Get-Item dist\*.zip, dist\galley-windows-x64.exe, dist\SHA256SUMS) --generate-notes
